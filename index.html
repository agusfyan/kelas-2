<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventory Mesin • Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0b0f14;          /* base */
      --bg-soft:#0f141b;     /* cards */
      --muted:#7a8aa0;       /* text muted */
      --fg:#e6edf3;          /* text */
      --brand:#4cc2ff;       /* accent */
      --brand-2:#22c55e;     /* success */
      --warn:#f59e0b;        /* warning */
      --danger:#ef4444;      /* danger */
      --ring: rgba(76,194,255,.35);
      --radius:18px;
      --shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.03);
    }
    /* light mode overrides */
    :root.light{
      --bg:#f4f7fb;
      --bg-soft:#ffffff;
      --muted:#64748b;
      --fg:#0f172a;
      --brand:#0ea5e9;
      --brand-2:#16a34a;
      --warn:#d97706;
      --danger:#dc2626;
      --ring: rgba(14,165,233,.25);
      --shadow:0 10px 30px rgba(0,0,0,.08), inset 0 1px 0 rgba(255,255,255,.5);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family:'Inter',system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      background: radial-gradient(1200px 800px at 80% -10%, rgba(76,194,255,.08), transparent 40%),
                  radial-gradient(1000px 600px at 10% -10%, rgba(34,197,94,.06), transparent 40%),
                  var(--bg);
      color:var(--fg);
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
      transition: background .3s ease, color .3s ease;
    }
    /* Topbar */
    .topbar{
      position:sticky; top:0; z-index:50; backdrop-filter:saturate(1.2) blur(10px);
      background: color-mix(in oklab, var(--bg), black 8%);
      border-bottom:1px solid rgba(0,0,0,.15);
    }
    .container{max-width:1200px; margin:0 auto; padding:14px 18px;}
    .row{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
    .brand{display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.3px}
    .brand .dot{width:10px; height:10px; border-radius:50%; background:linear-gradient(135deg,var(--brand),#9ae6ff)}
    .nav{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
    .tabbtn{
      appearance:none; border:1px solid rgba(0,0,0,.15); background:var(--bg-soft); color:var(--fg);
      padding:10px 14px; border-radius:12px; cursor:pointer; transition:.2s ease; box-shadow:var(--shadow);
    }
    .tabbtn[aria-current="page"]{outline: none; border-color:var(--brand); box-shadow:0 0 0 3px var(--ring)}
    .spacer{flex:1}
    select, input, button{
      background:color-mix(in oklab, var(--bg-soft), black 8%); border:1px solid rgba(0,0,0,.15); color:var(--fg);
      padding:10px 12px; border-radius:12px; outline:none; transition:.2s ease; box-shadow:var(--shadow);
    }
    select:focus, input:focus{border-color:var(--brand); box-shadow:0 0 0 3px var(--ring)}
    /* Layout */
    main{max-width:1200px; margin:24px auto; padding:0 18px 60px}
    .card{background:linear-gradient(180deg, rgba(255,255,255,.03), transparent 40%), var(--bg-soft); border:1px solid rgba(0,0,0,.12); border-radius:var(--radius); box-shadow:var(--shadow);}
    .card .hd{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px; border-bottom:1px solid rgba(0,0,0,.1)}
    .card .bd{padding:16px}
    .muted{color:var(--muted)}
    .grid{display:grid; gap:14px}
    @media(min-width:860px){ .grid.two{grid-template-columns:1fr 1fr} }
    .pill{font-size:12px; padding:6px 10px; border-radius:999px; border:1px solid rgba(0,0,0,.12)}
    /* Table */
    table{width:100%; border-collapse:collapse}
    thead th{position:sticky; top:0; background:color-mix(in oklab, var(--bg-soft), black 8%); backdrop-filter:blur(6px); text-align:left; font-weight:600; font-size:14px; padding:12px; border-bottom:1px solid rgba(0,0,0,.12)}
    tbody td{padding:12px; border-bottom:1px solid rgba(0,0,0,.08)}
    tbody tr:hover{background:color-mix(in oklab, var(--bg-soft), black 4%)}
    .toolbar{display:flex; gap:10px; flex-wrap:wrap}
    .count{font-weight:600}
    .kpi{display:flex; gap:12px; align-items:center}
    .kpi .dot{width:10px; height:10px; border-radius:50%; background:var(--brand)}
    .btn{cursor:pointer; border:1px solid rgba(0,0,0,.12)}
    .btn.brand{background:linear-gradient(135deg, #2aa8ff, #4cc2ff); color:#00111a; font-weight:700}
    .btn.success{background:linear-gradient(135deg, #16a34a, #22c55e); color:#03120a; font-weight:700}
    .btn.warn{background:linear-gradient(135deg, #f59e0b, #fbbf24); color:#2d1900; font-weight:700}
    .qty-low{color:var(--danger); font-weight:700}
    /* Forms */
    .form{display:grid; gap:12px}
    .form label{font-size:12px; color:var(--muted)}
    .row2{display:grid; gap:12px}
    @media(min-width:700px){ .row2{grid-template-columns:1fr 1fr} }
    /* Toast */
    .toast{position:fixed; right:18px; bottom:18px; background:color-mix(in oklab, var(--bg-soft), black 6%); color:var(--fg); border:1px solid rgba(0,0,0,.12); padding:12px 14px; border-radius:12px; box-shadow:var(--shadow); display:none}
    .toast.show{display:block}
    /* Footer */
    footer{opacity:.7; font-size:12px; text-align:center; padding:28px 0}
    .toggle-theme{cursor:pointer; width:40px; height:40px; display:grid; place-items:center; border-radius:10px; border:1px solid rgba(0,0,0,.12); background:var(--bg-soft)}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container row">
      <div class="brand"><span class="dot"></span> <span id="appTitle">Inventory Mesin</span></div>
      <nav class="nav" role="tablist" aria-label="Navigation">
        <button class="tabbtn" data-tab="dashboard" aria-current="page" id="tabDashboard">Dashboard</button>
        <button class="tabbtn" data-tab="input" id="tabInput">Input Items</button>
        <button class="tabbtn" data-tab="ambil" id="tabAmbil">Take Items</button>
        <button class="tabbtn" data-tab="riwayat" id="tabRiwayat">History</button>
      </nav>
      <div class="spacer"></div>
      <div class="toolbar">
        <select id="lang">
          <option value="id">🇮🇩 Indonesia</option>
          <option value="en">🇬🇧 English</option>
          <option value="zh">🇹🇼 中文（台灣）</option>
        </select>
        <button class="toggle-theme" id="themeBtn" title="Toggle theme">🌙</button>
        <span class="pill" id="syncState">⟳ Syncing…</span>
      </div>
    </div>
  </header>

  <main>
    <!-- DASHBOARD -->
    <section id="page-dashboard" class="grid" style="display:block">
      <div class="card">
        <div class="hd">
          <div class="kpi"><span class="dot"></span> <span id="dashTitle">Dashboard Stok Barang</span></div>
          <div class="toolbar">
            <input id="filterKode" type="search" placeholder="Cari berdasarkan Kode Barang…" />
            <button class="btn" id="btnRefresh">⟳ <span data-i18n="refresh">Refresh</span></button>
          </div>
        </div>
        <div class="bd">
          <div class="muted" style="margin-bottom:8px">
            <span data-i18n="totalItems">Total item</span>: <span class="count" id="totalCount">0</span>
          </div>
          <div style="max-height:60vh; overflow:auto; border-radius:12px">
            <table>
              <thead>
                <tr>
                  <th data-i18n="kode">Kode Barang</th>
                  <th data-i18n="nama">Nama Barang</th>
                  <th data-i18n="jumlah">Jumlah</th>
                  <th data-i18n="min">Min</th>
                </tr>
              </thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <!-- INPUT BARANG -->
    <section id="page-input" style="display:none">
      <div class="card">
        <div class="hd">
          <div class="kpi"><span class="dot"></span> <span data-i18n="inputTitle">Input Barang (Tambah Stok)</span></div>
        </div>
        <div class="bd">
          <form class="form" id="formAdd">
            <div class="row2">
              <div>
                <label data-i18n="kode">Kode Barang</label>
                <input id="addKode" required placeholder="Mis. SP-001" />
              </div>
              <div>
                <label data-i18n="nama">Nama Barang</label>
                <input id="addNama" placeholder="Mis. Bearing 6203" />
              </div>
            </div>
            <div class="row2">
              <div>
                <label data-i18n="qty">Jumlah</label>
                <input id="addQty" type="number" min="1" value="1" required />
              </div>
              <div>
                <label data-i18n="min">Min Stok (opsional)</label>
                <input id="addMin" type="number" min="0" placeholder="mis. 5" />
              </div>
            </div>
            <div class="row" style="justify-content:flex-end">
              <button type="submit" class="btn success" id="btnAdd"><span data-i18n="simpan">Simpan</span></button>
            </div>
          </form>
        </div>
      </div>
    </section>

    <!-- AMBIL BARANG -->
    <section id="page-ambil" style="display:none">
      <div class="card">
        <div class="hd">
          <div class="kpi"><span class="dot"></span> <span data-i18n="ambilTitle">Ambil Barang (Kurangi Stok)</span></div>
        </div>
        <div class="bd">
          <form class="form" id="formTake">
            <div class="row2">
              <div>
                <label data-i18n="kode">Kode Barang</label>
                <input id="takeKode" required placeholder="Mis. SP-001" />
              </div>
              <div>
                <label data-i18n="qty">Jumlah</label>
                <input id="takeQty" type="number" min="1" value="1" required />
              </div>
            </div>
            <div class="row" style="justify-content:flex-end">
              <button type="submit" class="btn warn" id="btnTake"><span data-i18n="proses">Proses</span></button>
            </div>
          </form>
        </div>
      </div>
    </section>

    <!-- RIWAYAT -->
    <section id="page-riwayat" style="display:none">
      <div class="card">
        <div class="hd">
          <div class="kpi"><span class="dot"></span> <span data-i18n="riwayatTitle">Riwayat Transaksi</span></div>
        </div>
        <div class="bd">
          <div style="max-height:60vh; overflow:auto; border-radius:12px">
            <table>
              <thead>
                <tr>
                  <th data-i18n="tanggal">Tanggal</th>
                  <th data-i18n="kode">Kode</th>
                  <th data-i18n="nama">Nama</th>
                  <th data-i18n="jenis">Jenis</th>
                  <th data-i18n="jumlah">Jumlah</th>
                  <th data-i18n="total">Total Setelah</th>
                </tr>
              </thead>
              <tbody id="tbodyLog"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>
  <footer>
    © <span id="year"></span> Inventory Mesin • <span class="muted" data-i18n="footNote">Realtime • Multi-user • Google Sheets</span>
  </footer>

  <script>
    /** ==========================
     *  CONFIG – GANTI BAGIAN INI
     *  ==========================
     *  1) Deploy Apps Script Web App dan tempel URL di bawah.
     *  2) Struktur response GET harus { data:[{kode,nama,jumlah,min}], log:[...] }
     */
    const API_URL = localStorage.getItem('API_URL') || 'https://script.google.com/macros/s/AKfycbwX7dZOn4AYgDTZr4_exF9Z4hee8i8s92xqqqkfRYE_b9x1BuIjjKDsP5pbESDWVqJ_jA/exec';
    const DEFAULT_MIN = 5; // fallback jika kolom Min tidak ada/ kosong

    // Tema (dark/light) persist
    const root = document.documentElement;
    const savedTheme = localStorage.getItem('theme') || 'dark';
    if(savedTheme === 'light'){ root.classList.add('light'); }
    document.getElementById('themeBtn').textContent = savedTheme==='light' ? '☀️' : '🌙';
    document.getElementById('themeBtn').addEventListener('click', ()=>{
      root.classList.toggle('light');
      const isLight = root.classList.contains('light');
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
      document.getElementById('themeBtn').textContent = isLight ? '☀️' : '🌙';
    });

    // Opsional: ganti endpoint via prompt CTRL+K (desktop)
    window.addEventListener('keydown', (e)=>{
      if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){
        const url = prompt('Set API URL (Apps Script Web App /exec):', API_URL);
        if(url){ localStorage.setItem('API_URL', url); notify('API URL tersimpan'); location.reload(); }
      }
    });

    /** ==========================
     *  i18n – 3 BAHASA
     *  ==========================
     */
    const I18N = {
      id:{
        appTitle:'Inventory Mesin', dashTitle:'Dashboard Stok Barang', refresh:'Refresh', totalItems:'Total item',
        kode:'Kode Barang', nama:'Nama Barang', jumlah:'Jumlah', qty:'Jumlah', min:'Min', total:'Total',
        inputTitle:'Input Barang (Tambah Stok)', ambilTitle:'Ambil Barang (Kurangi Stok)', riwayatTitle:'Riwayat Transaksi',
        simpan:'Simpan', proses:'Proses', tanggal:'Tanggal', jenis:'Jenis', footNote:'Realtime • Multi-user • Google Sheets'
      },
      en:{
        appTitle:'Machine Inventory', dashTitle:'Inventory Dashboard', refresh:'Refresh', totalItems:'Total items',
        kode:'Item Code', nama:'Item Name', jumlah:'Quantity', qty:'Quantity', min:'Min', total:'Total',
        inputTitle:'Add Items (Increase Stock)', ambilTitle:'Take Items (Decrease Stock)', riwayatTitle:'Transaction History',
        simpan:'Save', proses:'Submit', tanggal:'Date', jenis:'Type', footNote:'Realtime • Multi-user • Google Sheets'
      },
      zh:{
        appTitle:'機械庫存系統', dashTitle:'庫存儀表板', refresh:'重新整理', totalItems:'項目總數',
        kode:'商品代碼', nama:'商品名稱', jumlah:'數量', qty:'數量', min:'最低存量', total:'總計',
        inputTitle:'新增庫存（增加數量）', ambilTitle:'領出庫存（減少數量）', riwayatTitle:'交易紀錄',
        simpan:'儲存', proses:'送出', tanggal:'日期', jenis:'類型', footNote:'即時 • 多使用者 • Google 試算表'
      }
    };

    const $ = sel => document.querySelector(sel);
    const $$ = sel => document.querySelectorAll(sel);

    // Apply language
    const langSel = $('#lang');
    const savedLang = localStorage.getItem('lang') || 'id';
    langSel.value = savedLang;
    function applyLang(l){
      const t = I18N[l] || I18N.id;
      $('#appTitle').textContent = t.appTitle;
      $('#dashTitle').textContent = t.dashTitle;
      $$('[data-i18n]').forEach(el=>{ const key = el.getAttribute('data-i18n'); if(t[key]) el.textContent = t[key]; });
      document.title = t.appTitle + ' • ' + t.dashTitle;
    }
    applyLang(savedLang);
    langSel.addEventListener('change', ()=>{ localStorage.setItem('lang', langSel.value); applyLang(langSel.value); });

    // Tabs
    const pages = {
      dashboard: $('#page-dashboard'),
      input: $('#page-input'),
      ambil: $('#page-ambil'),
      riwayat: $('#page-riwayat')
    };
    $$('#tabDashboard, #tabInput, #tabAmbil, #tabRiwayat').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const tab = btn.dataset.tab;
        Object.entries(pages).forEach(([k,el])=> el.style.display = (k===tab?'block':'none'));
        $$('#tabDashboard, #tabInput, #tabAmbil, #tabRiwayat').forEach(b=> b.removeAttribute('aria-current'));
        btn.setAttribute('aria-current','page');
        history.replaceState(null,'', '#'+tab);
      });
    });
    if(location.hash && pages[location.hash.slice(1)]){
      document.querySelector(`[data-tab="${location.hash.slice(1)}"]`)?.click();
    }

    // UI helpers
    const toast = $('#toast');
    function notify(msg){ toast.textContent = msg; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'), 2400); }
    function syncing(on){ const el = $('#syncState'); el.textContent = on ? '⟳ Syncing…' : '✓ Synced'; el.style.borderColor = on? 'rgba(0,0,0,.12)' : 'rgba(34,197,94,.6)'; }

    /** ==========================
     *  DATA LAYER
     *  ==========================
     */
    let INVENTORY = [];
    let LOGS = [];

    async function apiGetAll(){
      syncing(true);
      const url = API_URL + '?mode=all&_t=' + Date.now();
      const res = await fetch(url, { method:'GET', headers:{'accept':'application/json'} });
      if(!res.ok) throw new Error('HTTP '+res.status);
      const json = await res.json();
      return json;
    }

    async function apiMutate(action, payload){
      const form = new URLSearchParams();
      form.set('action', action); // 'add' | 'take'
      Object.entries(payload).forEach(([k,v])=>{ if(v!==undefined && v!==null) form.set(k, v); });
      const res = await fetch(API_URL, {
        method:'POST',
        headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body: form.toString()
      });
      if(!res.ok) throw new Error('HTTP '+res.status);
      return await res.json();
    }

    function renderTable(rows){
      const tbody = $('#tbody');
      tbody.innerHTML = '';
      const q = $('#filterKode').value.trim().toLowerCase();
      const filtered = rows.filter(r => !q || String(r.kode||'').toLowerCase().includes(q));
      filtered.forEach(r=>{
        const min = (r.min==='' || r.min===undefined || r.min===null) ? DEFAULT_MIN : Number(r.min);
        const low = Number(r.jumlah||0) < Number(min);
        const tr = document.createElement('tr');
        tr.innerHTML = `<td><code>${escapeHtml(r.kode||'')}</code></td>
                        <td>${escapeHtml(r.nama||'')}</td>
                        <td style="font-variant-numeric:tabular-nums" class="${low?'qty-low':''}">${Number(r.jumlah||0)}</td>
                        <td style="font-variant-numeric:tabular-nums">${min}</td>`;
        tbody.appendChild(tr);
      });
      $('#totalCount').textContent = filtered.length;
    }

    function renderLogs(rows){
      const tbody = $('#tbodyLog');
      tbody.innerHTML = '';
      rows.forEach(r=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${escapeHtml(r.tanggal||'')}</td>
                        <td><code>${escapeHtml(r.kode||'')}</code></td>
                        <td>${escapeHtml(r.nama||'')}</td>
                        <td>${escapeHtml(r.jenis||'')}</td>
                        <td style="font-variant-numeric:tabular-nums">${Number(r.jumlah||0)}</td>
                        <td style="font-variant-numeric:tabular-nums">${Number(r.total||0)}</td>`;
        tbody.appendChild(tr);
      });
    }

    function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m])); }

    // Initial load + polling
    async function refresh(){
      try{
        const json = await apiGetAll();
        INVENTORY = json.data || [];
        LOGS = json.log || [];
        renderTable(INVENTORY);
        renderLogs(LOGS);
        syncing(false);
      }catch(err){ syncing(false); notify('Gagal sync: '+err.message + '\nCek API_URL / izin Web App'); console.error(err); }
    }

    $('#btnRefresh').addEventListener('click', refresh);
    $('#filterKode').addEventListener('input', ()=> renderTable(INVENTORY));

    // Smart polling
    let pollMs = 3500; let poller;
    function startPolling(){ stopPolling(); poller = setInterval(refresh, pollMs); }
    function stopPolling(){ if(poller) clearInterval(poller); }
    document.addEventListener('visibilitychange', ()=>{ if(document.hidden) stopPolling(); else { refresh(); startPolling(); } });

    // Forms: ADD
    $('#formAdd').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const kode = $('#addKode').value.trim();
      const nama = $('#addNama').value.trim();
      const qty = parseInt($('#addQty').value,10) || 0;
      const min = $('#addMin').value === '' ? undefined : parseInt($('#addMin').value,10);
      if(!kode || qty<=0){ notify('Lengkapi data'); return; }
      try{
        await apiMutate('add', { kode, nama, qty, min });
        notify('Successfully added');
        $('#addQty').value = 1; // reset
        refresh();
      }catch(err){ notify('Gagal tambah: '+err.message); }
    });

    // Forms: TAKE
    $('#formTake').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const kode = $('#takeKode').value.trim();
      const qty = parseInt($('#takeQty').value,10) || 0;
      if(!kode || qty<=0){ notify('Lengkapi data'); return; }
      try{
        await apiMutate('take', { kode, qty });
        notify('Successfully reduced');
        $('#takeQty').value = 1;
        refresh();
      }catch(err){ notify('Gagal kurangi: '+err.message); }
    });

    // Boot
    $('#year').textContent = new Date().getFullYear();
    refresh();
    startPolling();
  </script>

  <!--
  ==============================
  BACKEND (COPY ke Google Apps Script)
  - Deploy as Web App: Anyone memiliki akses
  - GET: returns { data:[{kode,nama,jumlah,min}], log:[{tanggal,kode,nama,jenis,jumlah,total}] }
  - POST: action=add|take, fields: kode, nama, qty, (min optional)
  ==============================
  -->
</body>
</html>
